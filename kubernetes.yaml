apiVersion: v1
kind: Namespace
metadata:
  name: roro
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: curso-devops-lab3-config
  namespace: roro
data:
  USER_KEY: "roro-user"
---
apiVersion: v1
kind: Secret
metadata:
  name: curso-devops-lab3-secret
  namespace: roro
type: Opaque
stringData:
  BD_PASSWORD: "123456"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: curso-devops-lab3
  namespace: roro
  labels:
    app: curso-devops-lab3
spec:
  replicas: 3
  selector:
    matchLabels:
      app: curso-devops-lab3
  template:
    metadata:
      labels:
        app: curso-devops-lab3
    spec:
      containers:
        - name: curso-devops-lab3
          image: ghcr.io/roro051987/curso-devops-lab3:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: development
            - name: PORT
              value: "3000"
            - name: USER_KEY
              valueFrom:
                configMapKeyRef:
                  name: curso-devops-lab3-config
                  key: USER_KEY
                  optional: false
            - name: BD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: curso-devops-lab3-secret
                  key: BD_PASSWORD
                  optional: false
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: curso-devops-lab3-service
  namespace: roro
  labels:
    app: curso-devops-lab3
spec:
  selector:
    app: curso-devops-lab3
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: ClusterIP